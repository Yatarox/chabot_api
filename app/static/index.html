<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            width: 90%;
            max-width: 800px;
            height: 90vh;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .chat-header h1 {
            font-size: 1.5em;
            margin-bottom: 5px;
        }

        .chat-header p {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .status {
            font-size: 0.8em;
            margin-top: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #4ade80;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            display: flex;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.bot {
            justify-content: flex-start;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 18px;
            word-wrap: break-word;
        }

        .user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .bot .message-content {
            background: #f3f4f6;
            color: #1f2937;
            border-bottom-left-radius: 4px;
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
            background: #f3f4f6;
            border-radius: 18px;
            width: fit-content;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: #9ca3af;
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: 0.5;
            }
            30% {
                transform: translateY(-10px);
                opacity: 1;
            }
        }

        .input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid #e5e7eb;
            display: flex;
            gap: 10px;
        }

        .input-area input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #e5e7eb;
            border-radius: 25px;
            outline: none;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .input-area input:focus {
            border-color: #667eea;
        }

        .input-area button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            transition: transform 0.2s, opacity 0.2s;
        }

        .input-area button:hover:not(:disabled) {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        .input-area button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .clear-btn {
            background: #ef4444 !important;
        }

        .clear-btn:hover {
            background: #dc2626 !important;
        }

        @media (max-width: 600px) {
            .message-content {
                max-width: 85%;
            }
            
            .input-area button {
                padding: 12px 16px;
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>Chatbot Assistant</h1>
            <p>Ask me anything!</p>
            <div class="status">
                <div class="status-indicator"></div>
                <span id="status-text">Connecté</span>
            </div>
        </div>

        <div class="messages-area" id="messages-area">
            <div class="message bot">
                <div class="message-content">
                    Hello! 👋 I am your assistant. How can I help you today?
                </div>
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="user-input" placeholder="Type your message here..." onkeypress="handleKeyPress(event)">
            <button id="send-btn" onclick="sendMessage()">Send</button>
            <button class="clear-btn" onclick="clearChat()">Clear</button>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8080/api';
        let isWaitingForResponse = false;

        async function checkHealth() {
            try {
                const response = await fetch(`${API_URL}/health`);
                const statusText = document.getElementById('status-text');
                const indicator = document.querySelector('.status-indicator');
                
                if (response.ok) {
                    statusText.textContent = 'Connecté';
                    indicator.style.backgroundColor = '#4ade80';
                } else {
                    statusText.textContent = 'Erreur de connexion';
                    indicator.style.backgroundColor = '#ef4444';
                }
            } catch (error) {
                document.getElementById('status-text').textContent = 'Hors ligne';
                document.querySelector('.status-indicator').style.backgroundColor = '#ef4444';
            }
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const message = input.value.trim();
            
            if (!message || isWaitingForResponse) return;
            
            // Afficher le message de l'utilisateur
            addMessage(message, 'user');
            input.value = '';
            
            // Désactiver l'envoi
            isWaitingForResponse = true;
            toggleInput(false);
            
            // Afficher l'indicateur de frappe
            showTypingIndicator();
            
            try {
                const response = await fetch(`${API_URL}/chat`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ message: message })
                });
                
                removeTypingIndicator();
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || 'Erreur serveur');
                }
                
                const data = await response.json();
                addMessage(data.response, 'bot');
                
            } catch (error) {
                removeTypingIndicator();
                addMessage(`Désolé, une erreur s'est produite: ${error.message}`, 'bot');
                console.error('Erreur:', error);
            } finally {
                isWaitingForResponse = false;
                toggleInput(true);
            }
        }
        
        function addMessage(text, sender) {
            const messagesArea = document.getElementById('messages-area');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.textContent = text;
            
            messageDiv.appendChild(contentDiv);
            messagesArea.appendChild(messageDiv);
            
            messagesArea.scrollTop = messagesArea.scrollHeight;
        }
        
        function showTypingIndicator() {
            const messagesArea = document.getElementById('messages-area');
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message bot';
            typingDiv.id = 'typing-indicator';
            
            const indicator = document.createElement('div');
            indicator.className = 'typing-indicator';
            indicator.innerHTML = '<span></span><span></span><span></span>';
            
            typingDiv.appendChild(indicator);
            messagesArea.appendChild(typingDiv);
            messagesArea.scrollTop = messagesArea.scrollHeight;
        }
        
        function removeTypingIndicator() {
            const indicator = document.getElementById('typing-indicator');
            if (indicator) {
                indicator.remove();
            }
        }
        
        function toggleInput(enabled) {
            const input = document.getElementById('user-input');
            const sendBtn = document.getElementById('send-btn');
            
            input.disabled = !enabled;
            sendBtn.disabled = !enabled;
            
            if (enabled) {
                input.focus();
            }
        }
        
        function clearChat() {
            const messagesArea = document.getElementById('messages-area');
            messagesArea.innerHTML = `
                <div class="message bot">
                    <div class="message-content">
                        Bonjour ! 👋 Je suis votre assistant. Comment puis-je vous aider aujourd'hui ?
                    </div>
                </div>
            `;
        }
        
        function handleKeyPress(event) {
            if (event.key === 'Enter' && !isWaitingForResponse) {
                sendMessage();
            }
        }
        
        setInterval(checkHealth, 30000);
        
        checkHealth();
        
        document.getElementById('user-input').focus();
    </script>
</body>
</html>
